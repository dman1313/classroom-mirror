name: Teacher dashboard checks
on: [push, pull_request]
jobs:
  offline-behaviour:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-v2-runtime.txt pytest==9.1.1 httpx==0.28.1
      - run: python -m pytest -q v2_tests -m 'not camera'
      - run: python check-v2.py --stage t0
      - run: python check-v2.py --stage t1-mac
